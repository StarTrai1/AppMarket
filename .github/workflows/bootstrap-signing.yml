name: Bootstrap Fork Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Generate and encrypt fork signing key
        env:
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          EXPORT_PASSWORD: ${{ secrets.SIGNING_EXPORT_PASSWORD }}
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
        run: |
          set -euo pipefail
          test "$HAS_SIGNING_KEY" = false
          test -n "$KEYSTORE_PASS"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$EXPORT_PASSWORD"
          umask 077
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/appmarket.jks" \
            -storetype JKS -storepass:env KEYSTORE_PASS -keypass:env KEY_PASSWORD \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
            -dname 'CN=StarTrai1 AppMarket, OU=AppMarket, O=StarTrai1'
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -in "$RUNNER_TEMP/appmarket.jks" -out "$RUNNER_TEMP/appmarket.jks.enc" \
            -pass env:EXPORT_PASSWORD
          rm -f "$RUNNER_TEMP/appmarket.jks"
      - name: Upload encrypted signing key
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-fork-signing-key
          path: ${{ runner.temp }}/appmarket.jks.enc
          retention-days: 1
          if-no-files-found: error
      - name: Clean runner key material
        if: always()
        run: rm -f "$RUNNER_TEMP/appmarket.jks" "$RUNNER_TEMP/appmarket.jks.enc"
